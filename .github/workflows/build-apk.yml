name: Build APK (self-signed)

# 无需任何仓库密钥：用自己的 GitHub 账号 fork 后推送，Actions 会自动编出
# 可直接安装的 release APK，从 Actions 运行页的 Artifacts 下载。
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK with a throwaway key
        run: |
          set -euo pipefail
          UNSIGNED="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*signed*' | head -n1)"
          echo "Found: $UNSIGNED"
          keytool -genkeypair -v \
            -keystore /tmp/meilox.jks \
            -alias meilox \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass meilox -keypass meilox \
            -dname "CN=MeiloX Local Build, OU=Local, O=MeiloX, L=Shenzhen, ST=GD, C=CN"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks /tmp/meilox.jks \
            --ks-key-alias meilox \
            --ks-pass pass:meilox \
            --key-pass pass:meilox \
            --out app-release.apk \
            "$UNSIGNED"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeiloX-release
          path: app-release.apk
          if-no-files-found: error
          compression-level: 0
